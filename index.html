<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>CIRC HQ | The Playbook</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-lockup" aria-label="CIRC HQ, The Playbook">
          <strong>CIRC HQ</strong>
          <span>The Playbook</span>
        </div>
        <nav class="primary-nav" aria-label="Primary navigation">
          <button type="button" data-route="today" aria-label="Today" aria-current="page">
            <img src="assets/icons/house.svg" alt="">
            <span>Today</span>
          </button>
          <button type="button" data-route="projects" aria-label="Year Map">
            <img src="assets/icons/books.svg" alt="">
            <span>Year Map</span>
          </button>
          <button type="button" data-route="schedule" aria-label="Schedule">
            <img src="assets/icons/calendar-dots.svg" alt="">
            <span>Schedule</span>
          </button>
          <button type="button" data-route="room" aria-label="Room">
            <img src="assets/icons/chalkboard-teacher.svg" alt="">
            <span>Room</span>
          </button>
          <button type="button" data-route="settings" aria-label="Settings">
            <img src="assets/icons/gear-six.svg" alt="">
            <span>Settings</span>
          </button>
        </nav>
      </div>
    </header>
    <main id="app-main" tabindex="-1">
      <section class="loading-card" aria-live="polite">
        <p class="eyebrow">Today</p>
        <h1>Opening The Playbook</h1>
        <p>Loading saved local information.</p>
      </section>
    </main>
    <div id="app-status" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
