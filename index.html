<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e6fd6">
    <title>CIRC HQ | Grades 5-6</title>
    <link rel="icon" type="image/png" href="assets/icons/sv-interlock.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="theme.css">
  </head>
  <body>
    <a class="skip-link" href="#app-main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-lockup" aria-label="CIRC HQ, Grades 5-6">
          <img class="circ-brand-icon" src="assets/icons/sv-interlock.png" width="72" height="42" alt="Seneca Valley">
          <div>
            <strong>CIRC HQ</strong>
            <span>Grades 5-6</span>
          </div>
        </div>
        <nav class="primary-nav" aria-label="Primary navigation">
          <button type="button" data-route="today" aria-label="Today" aria-current="page">
            <img src="assets/icons/house.svg" alt="">
            <span>Today</span>
          </button>
          <button type="button" data-route="projects" aria-label="Playbooks">
            <img src="assets/icons/books.svg" alt="">
            <span>Playbooks</span>
          </button>
          <button type="button" data-route="schedule" aria-label="Schedule">
            <img src="assets/icons/calendar-dots.svg" alt="">
            <span>Schedule</span>
          </button>
          <button type="button" data-route="room" aria-label="Room">
            <img src="assets/icons/chalkboard-teacher.svg" alt="">
            <span>Room</span>
          </button>
          <a class="nav-link" href="arcade.html" aria-label="Arcade">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="4"></rect><path d="M8 11v3M6.5 12.5h3M15 12h.01M17.5 13.5h.01"></path></svg>
            <span>Arcade</span>
          </a>
          <button type="button" data-route="settings" aria-label="Settings">
            <img src="assets/icons/gear-six.svg" alt="">
            <span>Settings</span>
          </button>
        </nav>
      </div>
    </header>
    <main id="app-main" tabindex="-1">
      <section class="loading-card" aria-live="polite">
        <p class="eyebrow">Today</p>
        <h1>Opening The Playbook</h1>
        <p>Loading saved local information.</p>
      </section>
    </main>
    <div id="app-status" class="visually-hidden" aria-live="polite"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
